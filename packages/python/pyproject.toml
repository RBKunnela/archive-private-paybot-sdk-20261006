[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paybot-sdk"
version = "0.2.0"
description = "Python port of paybot-sdk — USDC/EURC payments for AI agents via the x402 protocol."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "PayBot Contributors" },
]
keywords = ["x402", "agent-payments", "usdc", "base", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "eth-account>=0.13,<1.0",
]

[project.optional-dependencies]
signing = [
    # Required for real-mode EIP-3009 signing in PayBotClient.pay().
    "eth-account>=0.13,<1.0",
    "eth-typing>=6.0.0,<7",
]
mcp = [
    # Will be required by the MCP integration mirror of paybot-mcp; not used yet.
    "mcp>=1.27.2,<2.0",
]
web = [
    # Required for the FastAPI dependency variant of the x402 payment-wall
    # middleware (paybot_402_dependency). The raw-ASGI Paybot402Middleware needs
    # no third-party import. FastAPI is lazy-imported, so it is NOT a hard dep.
    "fastapi>=0.110",
]
otel = [
    # Optional: when installed, telemetry spans carry real OpenTelemetry Status
    # objects instead of the dict fallback shape. Only the API package is needed.
    "opentelemetry-api>=1.20",
]
dev = [
    # Convenience aggregate: signing + web + test + lint in one extra for
    # contributors and the `python-tests` CI job (which runs `uv run ruff`).
    "eth-account>=0.13,<1.0",
    "eth-typing>=6.0.0,<7",
    "fastapi>=0.110",
    "opentelemetry-api>=1.20",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "respx>=0.21",
    "ruff>=0.11,<0.12",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "respx>=0.21",  # httpx mock for the test suite
    "opentelemetry-api>=1.20",  # exercises the real-OTel status path in tests
]

[project.urls]
Homepage = "https://github.com/RBKunnela/paybot-sdk"
Issues = "https://github.com/RBKunnela/paybot-sdk/issues"

[tool.setuptools.packages.find]
include = ["paybot_sdk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
