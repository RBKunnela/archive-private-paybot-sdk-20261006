name: CI

# Actions pinned to immutable SHAs per supply-chain hygiene policy (paybot-sdk
# PR #11 CodeRabbit MAJOR-level guidance). Adjacent version comment marks the
# floating-tag intent so Dependabot github-actions can offer upgrades.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  open-core-boundary:
    name: open-core boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      # Hard gate: no operator-private / premium content may ship in the public
      # open-core SDK src/. Fails the build on any forbidden term or address.
      - name: Verify open-core boundary
        run: bash scripts/verify-open-core-boundary.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Coverage gate
        run: npm run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 14

      - name: Build
        run: npm run build

  # Post-mortem correction (PR #70): the Python SDK suite previously NEVER ran
  # in CI — a 27-test regression rode a green build because only the Node tests
  # gated PRs. This job makes the Python suite a first-class PR gate alongside
  # build. Context name `python-tests` is stable for branch protection.
  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0

      - name: Install dependencies (all extras)
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Run Python tests
        run: uv run pytest

  # Publishing lives in release.yml (triggered on a published GitHub Release),
  # NOT here. CI on push/PR runs build + tests + security only, so an ordinary
  # green commit means "merged & safe" without carrying a publish status that
  # fails on every non-release push. See .github/workflows/release.yml.
